server {
    listen 443 ssl;
    server_name erp.example.com;                 # change
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    client_max_body_size 12m;                    # >= WW_MAX_UPLOAD_MB
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8000;        # compose: http://app:8000
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
server { listen 80; server_name erp.example.com; return 301 https://$host$request_uri; }
